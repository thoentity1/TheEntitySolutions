<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Entity Solutions</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#041c3a;
    color:#ffffff;
}

/* NAVBAR */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
}

.logo img{
    height:55px;
}

nav ul{
    list-style:none;
    display:flex;
    gap:30px;
}

nav ul li a{
    color:#cfd8e3;
    text-decoration:none;
    font-size:15px;
    transition:0.3s;
}

nav ul li a:hover{
    color:#39c6ff;
}

.contact-btn{
    border:1px solid #39c6ff;
    padding:8px 18px;
    border-radius:6px;
    color:#39c6ff;
    text-decoration:none;
    transition:0.3s;
}

.contact-btn:hover{
    background:#39c6ff;
    color:#041c3a;
}

/* HERO */

.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:90px 8%;
    flex-wrap:wrap;
}

.hero-text{
    max-width:550px;
}

.hero-text h4{
    color:#9fb4c9;
    margin-bottom:12px;
    letter-spacing:1px;
}

.hero-text h1{
    font-size:60px;
    line-height:1.1;
    background:linear-gradient(90deg,#39c6ff,#6be3ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero-text p{
    margin:20px 0;
    color:#cfd8e3;
    line-height:1.6;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.btn{
    padding:13px 26px;
    border-radius:6px;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

.primary{
    background:linear-gradient(90deg,#39c6ff,#6be3ff);
    color:#041c3a;
}

.primary:hover{
    box-shadow:0 0 15px #39c6ff;
}

.secondary{
    border:1px solid #39c6ff;
    color:#39c6ff;
}

.secondary:hover{
    background:#39c6ff;
    color:#041c3a;
}

/* HERO IMAGE GLOW */

.hero-img img{
    width:450px;
    max-width:100%;
    filter:drop-shadow(0 0 25px rgba(57,198,255,0.35));
}

/* RESPONSIVE */

@media(max-width:900px){

.hero{
    text-align:center;
    justify-content:center;
}

.hero-img{
    margin-top:40px;
}

nav ul{
    display:none;
}
}

</style>
</head>

<body>

<!-- NAVIGATION -->

<nav>
    <div class="logo">
        <img src="TheEntitySolutionsLogo.jpeg" alt="The Entity Solutions Logo">
    </div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">What We Do</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">FAQ</a></li>
    </ul>

    <a href="#" class="contact-btn">Contact</a>
</nav>

<!-- HERO SECTION -->

<section class="hero">

    <div class="hero-text">
        <h4>WE HELP BUSINESSES</h4>
        <h1>SCALE & GROW</h1>

        <p>
            Professional web design, SEO, and IT solutions to help your business
            grow, improve visibility, and dominate the digital world.
        </p>

        <div class="buttons">
            <a href="#" class="btn secondary">Our Services</a>
            <a href="#" class="btn primary">Contact Us</a>
        </div>
    </div>

    <div class="hero-img">
        <!-- Optional image -->
        <img src="https://images.unsplash.com/photo-1555949963-aa79dcee981c" alt="Digital Technology">
    </div>

</section>

</body>
</html>
