<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Entity Solutions</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#020617,#0f172a,#020617);
  font-family:Arial, sans-serif;
}

/* logo container */
.logo-container{
  text-align:center;
}

/* logo */
.logo-container img{
  width:250px;
  max-width:100%;
  cursor:pointer;
  transition:0.3s;
}

/* hover effect */
.logo-container img:hover{
  transform:scale(1.08);
  filter:drop-shadow(0 0 20px rgba(34,211,238,0.6));
}

.tagline{
  margin-top:20px;
  color:#94a3b8;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div class="logo-container">
  <a href="index.html">
    <img src="TheEntitySolutionsLogo.jpeg" alt="The Entity Solutions">
  </a>

  <div class="tagline">CLICK TO ENTER</div>
</div>

</body>
</html>
