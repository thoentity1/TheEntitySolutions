<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | The Entity Solutions</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    min-height:100vh;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:40px;
    font-size:36px;
}

.cart-container{
    max-width:1000px;
    margin:auto;
    background:rgba(255,255,255,0.05);
    padding:30px;
    border-radius:20px;
    backdrop-filter: blur(10px);
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.cart-item:last-child{
    border-bottom:none;
}

.item-info{
    display:flex;
    flex-direction:column;
}

.item-name{
    font-weight:600;
    font-size:18px;
}

.item-price{
    color:#00e0ff;
    font-weight:600;
}

.remove-btn{
    background:#ff4d4d;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

.remove-btn:hover{
    opacity:0.8;
}

.total{
    text-align:right;
    margin-top:20px;
    font-size:22px;
    font-weight:600;
}

.cart-actions{
    margin-top:30px;
    display:flex;
    justify-content:space-between;
}

.btn{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    text-decoration:none;
    display:inline-block;
}

.clear-btn{
    background:#ff4d4d;
    color:white;
}

.checkout-btn{
    background:#00e0ff;
    color:#00303f;
}

.checkout-btn:hover{
    opacity:0.9;
}

.empty{
    text-align:center;
    font-size:18px;
    opacity:0.7;
}
</style>
</head>

<body>

<h1>Your Shopping Cart</h1>

<div class="cart-container" id="cartContainer">
    <!-- Items will load here -->
</div>

<script>

function loadCart(){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let container = document.getElementById("cartContainer");
    container.innerHTML = "";

    if(cart.length === 0){
        container.innerHTML = "<p class='empty'>Your cart is empty.</p>";
        return;
    }

    let total = 0;

    cart.forEach((item, index) => {
        total += item.price;

        container.innerHTML += `
            <div class="cart-item">
                <div class="item-info">
                    <span class="item-name">${item.name}</span>
                    <span class="item-price">R${item.price.toLocaleString()}</span>
                </div>
                <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
            </div>
        `;
    });

    container.innerHTML += `
        <div class="total">
            Total: R${total.toLocaleString()}
        </div>

        <div class="cart-actions">
            <button class="btn clear-btn" onclick="clearCart()">Clear Cart</button>
           <button onclick="goToContact()">Proceed to Checkout</button>
        </div>
    `;
}

function removeItem(index){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index,1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

function clearCart(){
    localStorage.removeItem("cart");
    loadCart();
}

loadCart();

</script>
<script>
function goToContact() {

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  if(cart.length === 0){
    alert("Your cart is empty");
    return;
  }

  let orderText = "🛒 Order Details:%0A%0A";

  let total = 0;

  cart.forEach(item => {
    orderText += item.name + " - R" + item.price + "%0A";
    total += item.price;
  });

  orderText += "%0A💰 Total: R" + total;

  // save order for contact page
  localStorage.setItem("orderMessage", orderText);

  // redirect to contact page
  window.location.href = "contact.html";
}
</script>
</body>
</html>
