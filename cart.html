<script>
function goToContact() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  if (cart.length === 0) {
    alert("Your cart is empty");
    return;
  }

  let orderText = "🛒 Order Details:%0A%0A";
  let total = 0;

  cart.forEach(item => {
    orderText += item.name + " - R" + item.price + "%0A";
    total += item.price;
  });

  orderText += "%0A💰 Total: R" + total;

  // save order for contact page
  localStorage.setItem("orderMessage", orderText);

  // redirect
  window.location.href = "contact.html";
}

function loadCart() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let container = document.getElementById("cartContainer");
  container.innerHTML = "";

  if (cart.length === 0) {
    container.innerHTML = "<p class='empty'>Your cart is empty.</p>";
    return;
  }

  let total = 0;

  cart.forEach((item, index) => {
    total += item.price;

    container.innerHTML += `
      <div class="cart-item">
        <div class="item-info">
          <span class="item-name">${item.name}</span>
          <span class="item-price">R${item.price.toLocaleString()}</span>
        </div>
        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
      </div>
    `;
  });

  container.innerHTML += `
    <div class="total">
      Total: R${total.toLocaleString()}
    </div>

    <div class="cart-actions">
      <button class="btn clear-btn" onclick="clearCart()">Clear Cart</button>
      <button class="btn checkout-btn" onclick="goToContact()">Proceed to Checkout</button>
    </div>
  `;
}

function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

function clearCart() {
  localStorage.removeItem("cart");
  loadCart();
}

loadCart();
</script>
